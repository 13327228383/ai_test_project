[pytest]
# ★ B5: 让 GitHub Actions / 本地 pytest --junitxml 输出兼容 xunit2 schema
junit_family = xunit2
testpaths = tests
# ★ v6.1: 启用 marker 分层 + 覆盖率门禁
#   注（2026-10-02 审计修正）：unit/security marker 当前无测试使用，
#   按 marker 过滤会选中 0 条（exit 5）。CI 实际以目录驱动：tests/unit 探测 +
#   tests/test_core + tests/test_chains（见 ci.yml chain-smoke job）。
#   --cov=src --cov-fail-under=70 → 覆盖率低于 70% 则 CI 失败
addopts = -ra --strict-markers
markers =
    asyncio: async tests using asyncio event loop
    unit: 单元测试 — 隔离 mock，不依赖外部服务
    integration: 集成测试 — 多模块协作，可能连真实 DB
    e2e: 端到端测试 — 完整流水线或浏览器自动化
    security: 安全测试 — 注入/越权/脱敏/泄漏防护
    slow: 慢测试 — 执行超过 10 秒，CI 可选跳过
filterwarnings =
    ignore::DeprecationWarning
